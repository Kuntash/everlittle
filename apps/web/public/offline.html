<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1e7" />
    <title>Everlittle is offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        align-items: center;
        background: #f7f1e7;
        color: #213c31;
        display: flex;
        font-family: ui-sans-serif, system-ui, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100svh;
        padding: max(2rem, env(safe-area-inset-top)) 1.4rem max(2rem, env(safe-area-inset-bottom));
      }
      main {
        background: #fffdf8;
        border: 1px solid #ddd6c8;
        border-radius: 1.5rem;
        max-width: 420px;
        padding: 2rem;
        text-align: center;
      }
      span {
        color: #b78b42;
        font-size: 2rem;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 2.4rem;
        font-weight: 500;
        line-height: 1;
        margin: 1rem 0;
      }
      p {
        color: #647068;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
      button {
        background: #173b32;
        border: 0;
        border-radius: 0.75rem;
        color: #fffdf8;
        font: inherit;
        font-weight: 700;
        min-height: 48px;
        padding: 0.75rem 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <span aria-hidden="true">✦</span>
      <h1>Everlittle is waiting for a connection.</h1>
      <p>
        Private memories are never stored in the offline page. Reconnect to open Diki’s archive.
      </p>
      <button onclick="location.reload()" type="button">Try again</button>
    </main>
  </body>
</html>
